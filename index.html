  let active = "all";
  const filters = document.getElementById("filters");
  const tracksEl = document.getElementById("tracks");

  const allBtn = document.createElement("button");
  allBtn.className = "filter-btn active"; allBtn.textContent = "全部 All";
  allBtn.onclick = () => { active = "all"; render(); document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active")); allBtn.classList.add("active") };
  filters.appendChild(allBtn);

  D.forEach(d => {
    const b = document.createElement("button");
    b.className = "filter-btn"; b.textContent = d.zh;
    b.onclick = () => { active = d.id; render(); document.querySelectorAll(".filter-btn").forEach(x => x.classList.remove("active")); b.classList.add("active") };
    filters.appendChild(b);
  });

  function render() {
    tracksEl.innerHTML = "";
    const show = active === "all" ? D : D.filter(d => d.id === active);
    show.forEach(d => {
      const total = d.phases.reduce((a, p) => a + p.s.length, 0);
      const t = document.createElement("div"); t.className = "track";
      const phases = d.phases.map(p => `
      <div class="phase">
        <div class="plabel">${p.label} · ${p.s.length} 项</div>
        <div class="skills">${p.s.map(s => `<div class="sk lv${p.lv}"><span class="e">${s[0]}</span><span class="z">${s[1]}</span></div>`).join("")}</div>
      </div>`).join("");
      t.innerHTML = `
      <div class="track-hdr" onclick="tog(this)">
        <div class="dot" style="background:${d.color}"></div>
        <div class="ti"><div class="en">${d.en}</div><div class="zh">${d.zh}</div></div>
        <span class="cnt">${total} 项</span>
        <span class="chev">▶</span>
      </div>
      <div class="tbody">${phases}</div>`;
      tracksEl.appendChild(t);
      if (active !== "all") {
        t.querySelector(".tbody").classList.add("o");
        t.querySelector(".chev").classList.add("o");
      }
    });
  }

  function tog(hdr) {
    hdr.nextElementSibling.classList.toggle("o");
    hdr.querySelector(".chev").classList.toggle("o");
  }

  render();
</script>
